services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d genranq"]
      interval: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    volumes: [storage:/app/backend/storage]
  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "app.worker"]
    depends_on: [api]
    volumes: [storage:/app/backend/storage]
volumes:
  pgdata:
  storage:
