<meta name="viewport" content="width=device-width"></head><body><h1>How to fix a dripping tap</h1>
<p>A dripping tap wastes water and money. Turn off the isolation valve, remove the handle, replace the washer and reassemble. If the drip continues the valve seat may be worn and need re-cutting by a plumber.</p>
